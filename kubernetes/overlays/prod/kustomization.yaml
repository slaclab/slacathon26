apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - path: deployment-patch.yaml
  - target:
      group: networking.k8s.io
      version: v1
      kind: Ingress
      name: slacathon26
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ard-modeling-service.slac.stanford.edu
  - path: secret-patch.yaml
