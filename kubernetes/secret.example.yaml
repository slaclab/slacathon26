# Reference manifest for the ricoberger.de VaultSecret plugin. Do not put
# secret values in this repository; store them at the configured Vault path.
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: application-secrets
  namespace: slacathon26
spec:
  path: secret/ad/ad-accel-online-ml-[dev|prod]/slacathon26/secret
  type: Opaque
  keys:
    - SLACATHON_ALTCHA_HMAC_KEY
    - SLACATHON_PUBLIC_URL
    - SLACATHON_SMTP_HOST
    - SLACATHON_SMTP_FROM
