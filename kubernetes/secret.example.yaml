# Copy this file outside the repository as secret.yaml, replace every value,
# then apply it before Argo CD's first reconciliation. Do not commit secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: slacathon26-secrets
  namespace: slacathon26
type: Opaque
stringData:
  SLACATHON_ALTCHA_HMAC_KEY: REPLACE_WITH_RANDOM_SECRET
  SLACATHON_PUBLIC_URL: https://REPLACE_WITH_PUBLIC_HOST
  SLACATHON_SMTP_HOST: REPLACE_WITH_SMTP_HOST
  SLACATHON_SMTP_FROM: REPLACE_WITH_SENDER_ADDRESS
