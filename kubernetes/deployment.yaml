apiVersion: apps/v1
kind: Deployment
metadata:
  name: slacathon26
  namespace: slacathon26
  labels:
    app.kubernetes.io/name: slacathon26
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: slacathon26
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slacathon26
    spec:
      containers:
        - name: app
          image: ghcr.io/slaclab/slacathon26:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: slacathon26-config
            - secretRef:
                name: slacathon26-secrets
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: slacathon26-data
