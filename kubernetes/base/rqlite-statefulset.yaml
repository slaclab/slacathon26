apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rqlite
  namespace: slacathon26
  labels:
    app.kubernetes.io/name: rqlite
spec:
  serviceName: rqlite-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: rqlite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rqlite
    spec:
      terminationGracePeriodSeconds: 10
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: rqlite
      containers:
        - name: rqlite
          image: rqlite/rqlite:8.43.0
          imagePullPolicy: IfNotPresent
          args:
            - -disco-mode=dns
            - '-disco-config={"name":"rqlite-headless"}'
            - -bootstrap-expect=3
            - -join-interval=1s
            - -join-attempts=120
            - -auth=/rqlite/auth/auth.json
            - -join-as=app
            - -auto-backup=/rqlite/backup/backup.json
          ports:
            - name: rqlite
              containerPort: 4001
              protocol: TCP
            - name: raft
              containerPort: 4002
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: rqlite
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /readyz?noleader
              port: rqlite
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: rqlite-data
              mountPath: /rqlite/file
            - name: rqlite-auth
              mountPath: /rqlite/auth
              readOnly: true
            - name: rqlite-backup
              mountPath: /rqlite/backup
              readOnly: true
      volumes:
        - name: rqlite-auth
          secret:
            secretName: rqlite-secrets
            items:
              - key: auth.json
                path: auth.json
        - name: rqlite-backup
          secret:
            secretName: rqlite-secrets
            items:
              - key: backup.json
                path: backup.json
  volumeClaimTemplates:
    - metadata:
        name: rqlite-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rqlite
  namespace: slacathon26
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rqlite
