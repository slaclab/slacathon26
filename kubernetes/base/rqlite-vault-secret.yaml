# Secret contents live only in Vault. Expected keys:
#   auth.json   - rqlite -auth file, e.g.
#       [{"username":"app","password":"...","perms":["execute","query","join","load","backup","status","ready"]},
#        {"username":"admin","password":"...","perms":["all"]},
#        {"username":"*","perms":["ready","status"]}]
#   backup.json - rqlite -auto-backup config (S3-compatible), e.g.
#       {"version":1,"type":"s3","interval":"1h","vacuum":true,"timestamp":true,
#        "sub":{"access_key_id":"...","secret_access_key":"...","region":"us-east-1",
#               "bucket":"slacathon26-backups","path":"rqlite/slacathon26.sqlite.gz",
#               "endpoint":"https://<s3-endpoint>","force_path_style":true}}
apiVersion: ricoberger.de/v1alpha1
kind: VaultSecret
metadata:
  name: rqlite-secrets
  namespace: slacathon26
spec:
  path: secret/ad/ad-accel-online-ml-default/slacathon26/rqlite
  type: Opaque
  keys:
    - auth.json
    - backup.json
