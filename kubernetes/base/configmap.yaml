apiVersion: v1
kind: ConfigMap
metadata:
  name: slacathon26-config
  namespace: slacathon26
data:
  SLACATHON_ACTIVE_TASK: fel
  SLACATHON_ROOT_PATH: /slacathon26
  SLACATHON_DB_FILE: /app/data/slacathon.db
  SLACATHON_LEADERBOARD_FILE: /app/data/leaderboard.json
  SLACATHON_SMTP_PORT: "25"
  SLACATHON_SMTP_USE_TLS: "false"
  SLACATHON_SMTP_VALIDATE_CERTS: "false"
  SLACATHON_LOG_LEVEL: info
