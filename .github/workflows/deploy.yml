name: Deploy image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable GHCR image tag, normally a 7-character commit SHA
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: deploy-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/slaclab/slacathon26

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - name: Check out main
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ -z "${IMAGE_TAG}" || "${IMAGE_TAG}" == "latest" || "${IMAGE_TAG}" == "main" || ! "${IMAGE_TAG}" =~ ^[0-9a-f]{7}$ ]]; then
            echo "image_tag must be a 7-character commit SHA; floating tags are not allowed."
            exit 1
          fi
          echo "Deploying ${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Update dev deployment descriptor
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          sed -i "s|^          image: .*|          image: ${image}|" kubernetes/overlays/dev/deployment-patch.yaml
          grep -F "          image: ${image}" kubernetes/overlays/dev/deployment-patch.yaml
          kubectl kustomize kubernetes/overlays/dev >/dev/null

      - name: Commit dev deployment
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if git diff --quiet -- kubernetes/overlays/dev/deployment-patch.yaml; then
            echo "Dev already references ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/dev/deployment-patch.yaml
          git commit -m "chore(deploy): deploy ${IMAGE_TAG} to dev [skip ci]"
          git push origin HEAD:main

  promote-prod:
    name: Promote to production
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Check out main
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0

      - name: Update production deployment descriptor
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          image="${IMAGE_NAME}:${IMAGE_TAG}"
          sed -i "s|^          image: .*|          image: ${image}|" kubernetes/overlays/prod/deployment-patch.yaml
          grep -F "          image: ${image}" kubernetes/overlays/prod/deployment-patch.yaml
          kubectl kustomize kubernetes/overlays/prod >/dev/null

      - name: Commit production promotion
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if git diff --quiet -- kubernetes/overlays/prod/deployment-patch.yaml; then
            echo "Production already references ${IMAGE_TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kubernetes/overlays/prod/deployment-patch.yaml
          git commit -m "chore(deploy): promote ${IMAGE_TAG} to prod [skip ci]"
          git push origin HEAD:main
