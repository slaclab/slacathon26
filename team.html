<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLACATHON 2026 :: TEAM</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            background: #000 !important;
        }
        
        body {
            background: #000 !important;
            color: #0f0 !important;
            font-family: 'VT323', monospace;
            font-size: 20px;
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
            background-image: 
                repeating-linear-gradient(
                    0deg,
                    rgba(0, 255, 0, 0.03),
                    rgba(0, 255, 0, 0.03) 1px,
                    transparent 1px,
                    transparent 2px
                ) !important;
        }
        
        .crt {
            animation: flicker 0.15s infinite;
        }
        
        @keyframes flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.97; }
        }
        
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0.02) 50%,
                rgba(255, 255, 255, 0)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .ascii-border {
            border: 2px solid #0f0;
            padding: 30px;
            margin: 20px 0;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            background: #000;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #0f0;
        }
        
        .title {
            font-size: 48px;
            letter-spacing: 8px;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite alternate;
            color: #0f0;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #0f0, 0 0 10px #0f0; }
            to { text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0; }
        }
        
        .subtitle {
            font-size: 24px;
            color: #0a0;
            letter-spacing: 4px;
        }
        
        .prompt {
            color: #0ff;
            margin-bottom: 20px;
            font-size: 24px;
        }
        
        .prompt::before {
            content: "> ";
            color: #ff0;
        }
        
        .terminal-output {
            background: rgba(0, 255, 0, 0.05);
            border: 1px solid #0a0;
            padding: 20px;
            margin: 20px 0;
            min-height: 200px;
        }
        
        .thinking {
            color: #666;
            font-style: italic;
        }
        
        .thinking::after {
            content: "...";
            animation: ellipsis 1.5s infinite;
        }
        
        @keyframes ellipsis {
            0% { content: ""; }
            25% { content: "."; }
            50% { content: ".."; }
            75% { content: "..."; }
            100% { content: ""; }
        }
        
        .ai-text {
            opacity: 0;
            display: inline;
        }
        
        .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #0f0;
            animation: blink 0.7s infinite;
            margin-left: 2px;
        }
        
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        
        .member-section {
            margin: 30px 0;
            border-left: 3px solid #0f0;
            padding-left: 20px;
        }
        
        .member-name {
            font-size: 28px;
            color: #0ff;
            margin-bottom: 10px;
            text-shadow: 0 0 5px #0ff;
        }
        
        .member-role {
            font-size: 22px;
            color: #ff0;
            margin-bottom: 15px;
        }
        
        .member-bio {
            font-size: 20px;
            line-height: 1.6;
            color: #0f0;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        
        .stat-box {
            border: 1px solid #0f0;
            padding: 15px;
            text-align: center;
            background: rgba(0, 255, 0, 0.05);
        }
        
        .stat-value {
            font-size: 32px;
            color: #ff0;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 18px;
            color: #0a0;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #0f0;
        }
        
        .nav-links a {
            color: #0ff;
            text-decoration: none;
            margin: 0 20px;
            font-size: 24px;
            transition: all 0.3s;
        }
        
        .nav-links a:hover {
            color: #ff0;
            text-shadow: 0 0 10px #ff0;
        }
        
        .ascii-art {
            font-size: 12px;
            line-height: 1.2;
            color: #0a0;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body class="crt">
    <div class="scanline"></div>
    
    <div class="container">
        <div class="ascii-border">
            <div class="header">
                <div class="title">╔═══ SLAC est. 1962 ═══╗</div>
                <div class="subtitle">║ BUILD BETTER WITH AI IN 2026║</div>
            </div>
            
            <div class="prompt">INITIALIZING DATABASE</div>
            
            <div class="terminal-output" id="output">
                <div class="thinking" id="thinking">LOADING</div>
                <div id="content" style="display: none;"></div>
                <span class="cursor" id="cursor"></span>
            </div>
            
            <div class="nav-links">
                <a href="/slacathon26/">← HOME</a>
                <a href="/slacathon26/board">LEADERBOARD</a>
            </div>
        </div>
    </div>

<script>
    const teamData = {
        intro: "Welcome to the SLACATHON 2026 team roster. We are a group of computational minimization enthusiasts.",
        members: [
            {
                name: "Dr. Alice Crane",
                role: "Lead Optimization Engineer",
                bio: "Specializes in Gaussian Process methods and Bayesian optimization. Previously at CERN working on particle accelerator calibration. PhD from Stanford in Applied Mathematics.",
            },
            {
                name: "Bob Mankowitz",
                role: "Algorithm Architect",
                bio: "Expert in gradient-free optimization and stochastic methods. Developed novel acquisition functions for black-box optimization. Former SpaceX engineer.",
            },
            {
                name: "Charlie Kwon",
                role: "Systems Engineer",
                bio: "Infrastructure specialist maintaining our high-performance compute cluster. Background in distributed systems and numerical methods. Stanford CS alumnus.",
            },
            {
                name: "Diana Kotava",
                role: "Research Scientist",
                bio: "Theoretical foundations of convex and non-convex optimization. Published extensively on convergence proofs. Visiting scholar from Belarus State University.",
            }
        ],
        footer: "Coming soon. e-mail: slacathon26@slac.stanford.edu for details"
    };

    let currentText = '';
    let currentIndex = 0;
    let isTyping = false;

    function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeText(text, element, speed = 30) {
        isTyping = true;
        for (let char of text) {
            element.innerHTML += char;
            await sleep(speed);
        }
        isTyping = false;
    }

    async function displayTeam() {
        const thinking = document.getElementById('thinking');
        const content = document.getElementById('content');
        const cursor = document.getElementById('cursor');

        // Simulate loading
        await sleep(200);

        thinking.style.display = 'none';
        content.style.display = 'block';

        // Type intro
        await typeText(teamData.intro + '\n\n', content, 1);
        await sleep(100);

        // Type each member
        for (let member of teamData.members) {
            const memberDiv = document.createElement('div');
            memberDiv.className = 'member-section';
            content.appendChild(memberDiv);

            // Name
            const nameDiv = document.createElement('div');
            nameDiv.className = 'member-name';
            memberDiv.appendChild(nameDiv);
            await typeText(`█ ${member.name}`, nameDiv, 5);
            await sleep(100);

            // Role
            const roleDiv = document.createElement('div');
            roleDiv.className = 'member-role';
            memberDiv.appendChild(roleDiv);
            await typeText(`└─ ${member.role}`, roleDiv, 5);
            await sleep(100);

            // Bio
            const bioDiv = document.createElement('div');
            bioDiv.className = 'member-bio';
            memberDiv.appendChild(bioDiv);
            await typeText(`   ${member.bio}`, bioDiv, 5);
            await sleep(300);
        }

        await sleep(500);

        // Footer
        const footerDiv = document.createElement('div');
        footerDiv.style.marginTop = '40px';
        footerDiv.style.paddingTop = '20px';
        footerDiv.style.borderTop = '1px solid #0f0';
        footerDiv.style.textAlign = 'center';
        footerDiv.style.color = '#0a0';
        content.appendChild(footerDiv);
        await typeText(teamData.footer, footerDiv, 10);

        // Hide cursor when done
        cursor.style.display = 'none';
    }

    // Start the animation
    displayTeam();
</script>

</body>
</html>
